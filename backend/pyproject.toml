[project]
name = "paradime-api"
version = "0.1.0"
description = "Trust and arbitration service for autonomous agent payments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "anthropic>=0.70.0",
    "fastapi>=0.116.0",
    "greenlet>=3.2.4",
    "pydantic-settings>=2.10.0",
    "sqlalchemy>=2.0.43",
    "uvicorn[standard]>=0.35.0",
    "web3>=7.13.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
